version: 2.1

orbs: 
  docker: circleci/docker@2.8.0
  ggshield: gitguardian/ggshield@1.1.4

workflows:
  build-and-publish:
    jobs:
      - ggshield/scan:
          name: Scan using Gitguardian shield
          base_revision: <<pipeline.git.base_revision>>
          revision: <<pipeline.git.revision>>
          context:
            - gitguardian

      - docker/publish:
          name: Build and Publish to Docker Hub
          image: thinxcloud/redis
          # Without an explicit tag the orb defaults to $CIRCLE_SHA1, so every
          # build published a SHA-only tag and :latest was last written in
          # 2022 — while docker-swarm.yml pulls thinxcloud/redis:latest.
          # Publish both: :latest for the swarm, the SHA for traceability.
          tag: 'latest,$CIRCLE_SHA1'
          # Publish only from main. Without this the job runs on every branch,
          # so any feature-branch push overwrites the production :latest tag.
          filters:
            branches:
              only: main
          context:
            - dockerhub